<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="robots" content="noindex">

<link rel="stylesheet" href="admin.css">
<style>
  .gate-card { max-width: 28rem; margin: 4rem auto; padding: 0 1rem; }

<script type="module" src="signin-microsoft.js"></script>
